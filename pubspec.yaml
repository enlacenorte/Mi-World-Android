name: mi_mundo_app
description: "My World - High-Fidelity 3D Vector Geography Game for Kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/atlas_5l.json
    - assets/data/oceans_5l.json
    - assets/data/trivia_155.json
    - assets/data/countries-110m.json
    - assets/audio/

  shaders:
    - assets/shaders/atmosphere.frag
    - assets/shaders/shockwave.frag
